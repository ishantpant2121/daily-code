name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test installed CLI
        run: csv-inspector examples/sales.csv --strict
      - name: Smoke-test installed learning modules outside the checkout
        run: |
          cd /tmp
          python -c "from data_splitting import train_test_split; from pathfinding import a_star; from preprocessing import StandardScaler; from regression_metrics import mean_squared_error; assert mean_squared_error([1, 2], [1, 2]) == 0.0; assert len(train_test_split([1, 2, 3], random_state=1)) == 2; assert StandardScaler().fit_transform([[1], [2]])[0][0] < 0; assert a_star({'a': [('b', 1)], 'b': []}, 'a', 'b') == (1.0, ['a', 'b'])"
      - name: Smoke-test installed ML and data-science modules
        run: |
          cd /tmp
          python - <<'PY'
          from classification_metrics import average_precision_score, balanced_accuracy_score, brier_score_loss, log_loss, matthews_corrcoef, precision_recall_curve, roc_curve
          from decision_tree import DecisionTreeClassifier
          from gaussian_nb import GaussianNB
          from imputation import SimpleImputer
          from kmeans import KMeans
          from knn_regressor import KNNRegressor
          from logistic_regression import LogisticRegression
          from model_selection import cross_val_predict, cross_val_score, cross_validate
          from hyperparameter_search import GridSearchCV, RandomizedSearchCV
          from ensemble import VotingClassifier
          from pca import PCA
          from pipeline import Pipeline
          from preprocessing import LabelEncoder, OneHotEncoder, StandardScaler, VarianceThreshold
          from regression_metrics import explained_variance_score, mean_squared_log_error

          assert balanced_accuracy_score([0, 1], [0, 1]) == 1.0
          assert matthews_corrcoef([0, 1], [0, 1]) == 1.0
          assert average_precision_score([0, 1], [0.1, 0.9]) == 1.0
          assert len(precision_recall_curve([0, 1], [0.1, 0.9])[0]) == 3
          assert len(roc_curve([0, 1], [0.1, 0.9])[0]) == 3
          assert brier_score_loss([0, 1], [0.1, 0.9]) < 0.02
          assert log_loss([0, 1], [0.1, 0.9]) < 0.2
          assert explained_variance_score([1, 2], [1, 2]) == 1.0
          assert mean_squared_log_error([1, 2], [1, 2]) == 0.0
          assert LogisticRegression(max_iter=20).fit([[0], [1]], [0, 1]).predict([[0]]) == [0]
          assert GaussianNB().fit([[0], [1]], [0, 1]).predict([[0]]) == [0]
          assert KNNRegressor(1).fit([[0], [1]], [0, 1]).predict([[0]]) == [0.0]
          assert len(KMeans(1).fit_predict([[0], [1]])) == 2
          assert len(PCA(1).fit_transform([[0, 1], [1, 2], [2, 3]])) == 3
          assert OneHotEncoder().fit_transform([["a"], ["b"]]) == [[1, 0], [0, 1]]
          assert LabelEncoder().fit_transform(["a", "b"]) == [0, 1]
          assert VarianceThreshold().fit_transform([[1, 0], [2, 0]]) == [[1.0], [2.0]]
          assert SimpleImputer().fit_transform([[1], [None], [3]]) == [[1], [2.0], [3]]
          tree = DecisionTreeClassifier().fit([[0], [1], [2], [3]], [0, 0, 1, 1])
          assert tree.predict([[0], [3]]) == [0, 1]
          pipeline = Pipeline([('scale', StandardScaler()), ('tree', DecisionTreeClassifier())])
          assert pipeline.fit([[0], [1], [2], [3]], [0, 0, 1, 1]).predict([[0], [3]]) == [0, 1]
          scores = cross_val_score(DecisionTreeClassifier(), [[0], [1], [2], [3], [4], [5], [10], [11], [12], [13], [14], [15]], [0] * 6 + [1] * 6, cv=3, scoring='accuracy', stratified=True)
          assert scores == [1.0, 1.0, 1.0]
          search_x = [[0], [1], [2], [8], [9], [10]]
          search_y = [0, 0, 0, 1, 1, 1]
          assert len(cross_val_predict(DecisionTreeClassifier(), search_x, search_y, cv=3, stratified=True)) == 6
          assert len(cross_validate(DecisionTreeClassifier(), search_x, search_y, cv=3, stratified=True)["test_score"]) == 3
          assert GridSearchCV(DecisionTreeClassifier(), {"max_depth": [1, 2]}, cv=3, scoring="accuracy", stratified=True).fit(search_x, search_y).best_score_ == 1.0
          assert RandomizedSearchCV(DecisionTreeClassifier(), {"max_depth": [1, 2]}, n_iter=2, cv=3, scoring="accuracy", stratified=True, random_state=1).fit(search_x, search_y).best_score_ == 1.0
          voter = VotingClassifier([("tree", DecisionTreeClassifier()), ("bayes", GaussianNB())], voting="soft").fit(search_x, search_y)
          assert voter.predict(search_x) == search_y
          PY
