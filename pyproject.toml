[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-code-lab"
version = "0.2.0"
description = "DSA examples, data-science utilities, and a dependency-free CSV profiling CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-inspector = "csv_inspector.cli:main"

[tool.setuptools]
py-modules = [
    "backtracking",
    "classification_metrics",
    "data_splitting",
    "decision_tree",
    "day1",
    "day2",
    "day3_linked_lists",
    "dynamic_programming",
    "ensemble",
    "gaussian_nb",
    "graphs",
    "greedy",
    "heaps",
    "hyperparameter_search",
    "imputation",
    "knn_classifier",
    "knn_regressor",
    "kmeans",
    "linear_regression",
    "logistic_regression",
    "matrix_algorithms",
    "model_selection",
    "pathfinding",
    "pipeline",
    "pca",
    "preprocessing",
    "recursion",
    "regression_metrics",
    "searching",
    "sorting",
    "statistics_utils",
    "string_algorithms",
    "trees",
    "union_find",
]

[tool.setuptools.packages.find]
include = ["csv_inspector*"]
